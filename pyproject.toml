[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SGDF"
version = "0.5.0"
description = "SGDF gradient-filter optimizer: Sign, Muon, optional fused CUDA, distributed DTensor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zhipeng Yao and SGDF contributors"}]
dependencies = ["torch>=2.0"]
keywords = ["SGDF", "PyTorch", "optimizer", "Muon", "signSGD", "distributed", "AMP"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
triton = ["triton>=3.0; sys_platform == 'linux'"]

[project.urls]
Source = "https://github.com/ZPyAo0591/SGDF-Optimizer"
Paper = "https://arxiv.org/abs/2311.02818"
CVPR = "https://openaccess.thecvf.com/content/CVPR2026/html/Yao_Dynamic_Momentum_Recalibration_in_Online_Gradient_Learning_CVPR_2026_paper.html"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["SGDF*"]
